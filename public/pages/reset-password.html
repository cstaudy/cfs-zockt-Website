<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030711">
  <title>Neues Passwort setzen | cfs_zockt</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>.recovery-wrap{max-width:760px;margin:0 auto}.password-rules{margin:8px 0 0;padding-left:18px;color:#8da4c1;font-size:13px;line-height:1.6}.password-rules li.ok{color:#43d68f}</style>
  <meta name="robots" content="noindex,nofollow,noarchive">
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/">cfs_<span>zockt</span></a><nav class="nav"><a href="/">HOME</a><a class="cta" href="/pages/login.html">LOGIN</a></nav></div></header>
<main class="container recovery-wrap">
  <section class="page-hero"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>NEUES PASSWORT SETZEN.</h1><p>Der Recovery-Token wird nach dem Öffnen aus der sichtbaren URL entfernt und nur einmal verwendet.</p></section>
  <section class="panel">
    <form id="resetPasswordForm" class="form-grid" novalidate>
      <div class="field full"><label for="resetPassword">NEUES PASSWORT</label><input id="resetPassword" type="password" minlength="15" maxlength="128" autocomplete="new-password" required></div>
      <div class="field full"><label for="resetPasswordConfirm">PASSWORT WIEDERHOLEN</label><input id="resetPasswordConfirm" type="password" minlength="15" maxlength="128" autocomplete="new-password" required></div>
      <div class="field full"><ul class="password-rules"><li data-rule="length">Mindestens 15 Zeichen</li><li data-rule="match">Beide Passwörter stimmen überein</li><li>Lange Passphrasen und Leerzeichen sind erlaubt.</li></ul></div>
      <div class="field full"><button id="resetPasswordBtn" class="btn primary" type="submit">PASSWORT ZURÜCKSETZEN</button></div>
    </form>
    <div id="resetPasswordMsg" class="notice hidden" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="/assets/js/app.js?v=v42-r9"></script>
<script src="/assets/js/page-reset-password.js"></script>
</body>
</html>
