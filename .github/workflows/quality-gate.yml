name: Creator Suite Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy automation v27
        run: npm run deploy27:check

      - name: Current release candidate seal
        run: npm run release25:verify

      - name: Write RC25 evidence
        run: |
          mkdir -p reports
          node tools/release-candidate-v25.mjs . --json > reports/release-candidate-v25.json

      - name: GitHub repository readiness
        run: npm run github21:check

      - name: Small cumulative regression
        run: npm run project:check

      - name: Deployment structure / Render readiness
        run: npm run deployment13:check

      - name: Backend / Repository V42 QA
        run: npm run check:v42

      - name: Post-V42 Stability
        run: npm run check:post-v42

      - name: Technical Acceptance Part 2
        run: npm run check:acceptance-part2

      - name: Generate GitHub bootstrap plan
        run: node tools/github-bootstrap-plan-v41.mjs .

      - name: Upload repository verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-release-verification-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            reports/release-candidate-v25.json
            reports/github-bootstrap-plan.json
            reports/github-bootstrap-plan.md

  launcher-quality:
    name: Launcher Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Launcher cumulative release gate
        working-directory: launcher
        run: npm run release:gate

      - name: Upload release-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release-gate-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            launcher/reports/release-gate.json
            launcher/reports/release-gate.md
